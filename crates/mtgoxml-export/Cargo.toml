[package]
name = "mtgoxml-export"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Capture and publish verified MTGO datasets and animated avatar assets"

[lints]
workspace = true

[dependencies]
mtgoxml = { path = "../..", features = ["http", "serde"] }
cildec = "0.1.0"
flate2 = "1.1.10"
glow = { version = "0.18.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
khronos-egl = { version = "6.0.0", default-features = false, features = ["1_5", "dynamic"] }
minijinja = { version = "3.1.0", default-features = false, features = ["builtins", "multi_template", "serde"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
webp-animation = { version = "0.10.0", default-features = false, features = ["static"] }
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2"] }
