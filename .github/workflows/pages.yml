name: Card browser

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - Cargo.toml
      - Cargo.lock
      - src/**
      - crates/**
      - web/**
      - templates/**
      - scripts/select-avatar-snapshot.mjs
      - scripts/install-avatar-shader-tools.sh
  workflow_run:
    workflows: [MTGO card data]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-browser-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build browser from published MTGO data
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build exporter
        run: cargo build --locked --release -p mtgoxml-export
      - name: Find the MTGO export
        id: mtgo_export
        uses: cardinalby/git-get-release-action@2ab178299eecb253f820dcf2cce11f62be1178f7 # v1
        with:
          releaseNameRegEx: '^MTGO card data [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          draft: 'false'
          prerelease: 'false'
          searchLimit: '1000'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download the selected snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          MTGO_EXPORT_TAG: ${{ steps.mtgo_export.outputs.tag_name }}
        run: gh release download "$MTGO_EXPORT_TAG" --repo "$GITHUB_REPOSITORY" --dir snapshot
      - name: Select published or locally completed avatar snapshot
        id: avatar_source
        run: node scripts/select-avatar-snapshot.mjs snapshot/snapshot.json
      - name: Cache completed legacy avatar snapshot
        if: steps.avatar_source.outputs.legacy == 'true'
        id: avatar_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: avatar-snapshot
          # Include every original downloaded byte, including snapshot.json and SHA256SUMS.
          # Exact keys only: restored outputs still pass native site verification below.
          key: >-
            pages-avatar-bootstrap-v2-ubuntu26-${{ runner.arch }}-${{ hashFiles('snapshot/**') }}-${{
            hashFiles('Cargo.toml', 'Cargo.lock', 'crates/mtgoxml-export/Cargo.toml',
            'crates/mtgoxml-export/src/main.rs', 'crates/mtgoxml-export/src/avatar_assets/**',
            'scripts/install-avatar-shader-tools.sh', 'src/**') }}
      - name: Cache avatar shader compiler
        if: >-
          steps.avatar_source.outputs.legacy == 'true' &&
          steps.avatar_cache.outputs.cache-hit != 'true'
        id: shader_tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/mtgoxml-shader-tools
          key: avatar-vkd3d-2.1-ubuntu26-${{ runner.arch }}-${{ hashFiles('scripts/install-avatar-shader-tools.sh') }}
      - name: Install avatar rendering tools
        if: >-
          steps.avatar_source.outputs.legacy == 'true' &&
          steps.avatar_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1-mesa-dri spirv-cross
      - name: Install shader compiler build dependencies
        if: >-
          steps.avatar_source.outputs.legacy == 'true' &&
          steps.avatar_cache.outputs.cache-hit != 'true' &&
          steps.shader_tools.outputs.cache-hit != 'true'
        run: >-
          sudo apt-get install --no-install-recommends -y
          build-essential pkg-config flex bison libjson-perl libvulkan-dev spirv-headers
      - name: Prepare avatar shader compiler
        if: >-
          steps.avatar_source.outputs.legacy == 'true' &&
          steps.avatar_cache.outputs.cache-hit != 'true'
        run: bash scripts/install-avatar-shader-tools.sh "$RUNNER_TEMP/mtgoxml-shader-tools"
      - name: Complete legacy avatars in an isolated snapshot
        if: >-
          steps.avatar_source.outputs.legacy == 'true' &&
          steps.avatar_cache.outputs.cache-hit != 'true'
        run: |
          cp -a snapshot avatar-snapshot
          target/release/mtgoxml-export avatars avatar-snapshot
      - name: Build and verify browser data
        env:
          SITE_SNAPSHOT: ${{ steps.avatar_source.outputs.snapshot_directory }}
        run: target/release/mtgoxml-export site "$SITE_SNAPSHOT" _site
      - name: Upload the complete site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy card browser
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy the complete site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
