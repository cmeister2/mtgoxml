[workspace]
members = [".", "crates/mtgoxml-export"]
default-members = [".", "crates/mtgoxml-export"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[package]
name = "mtgoxml"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Discover and resolve Magic: The Gathering Online card data from its ClickOnce deployment"
license = "MIT"
repository = "https://github.com/cmeister2/mtgoxml"
readme = "README.md"
keywords = ["mtgo", "magic", "clickonce", "manifest", "xml"]
categories = ["games", "web-programming::http-client"]
include = ["/src/**", "/web/*.js", "/web/*.css", "/examples/**", "/tests/**", "/fixtures/**", "/docs/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = []
http = ["dep:ureq"]
serde = ["dep:serde"]

[dependencies]
clickonce = "0.1.0"
regex = "1.13.1"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"], optional = true }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }
url = "2.5.8"

[[example]]
name = "resources"
required-features = ["http"]

[[example]]
name = "card"
required-features = ["http"]

[dev-dependencies]
serde_json = "=1.0.154"
